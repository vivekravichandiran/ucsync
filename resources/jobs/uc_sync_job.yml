resources:
  jobs:
    uc_sync_create_job:
      name: UC-Sync-Create-Job
      tasks:
        - task_key: create_uc_sync_job
          notebook_task:
            notebook_path: ../notebooks/UC_Sync_Create_Job
            base_parameters:
              execution_mode: LOCAL
              mode: SYNC
              dry_run: "true"
              run_now: "true"
              update_if_exists: "true"
              job_name: UC-Sync
              notebook_path: /Repos/UCSync/notebooks/UC_Sync_Main
              catalog_mapping_json: '{"ril_sandbox":"ril_sandbox_copy"}'
              catalog_mapping_path: ""
              location_mapping_csv_path: /Volumes/classic_stable_target_vk/uc_sync_ops/uc_exports/config/location-mapping.csv
              export_volume_path: /Volumes/classic_stable_target_vk/uc_sync_ops/uc_exports
              report_volume_path: /Volumes/classic_stable_target_vk/uc_sync_ops/uc_exports
              audit_table: classic_stable_target_vk.uc_sync_ops.uc_sync_audit

    uc_sync_local_create_jobs:
      name: UC-Sync-Local-Create-Jobs
      tasks:
        - task_key: create_local_stage_jobs
          notebook_task:
            notebook_path: ../notebooks/UC_Sync_Local_Create_Jobs
            base_parameters:
              stages: ALL
              catalog_mapping_json: '{"ril_sandbox":"ril_sandbox_ucsync_local"}'
              location_mapping_csv_path: /Volumes/classic_stable_target_vk/uc_sync_ops/uc_exports/config/location-mapping.csv
              catalogs: ril_sandbox
              schemas: ril_sandbox.ucsync_local_01
              dry_run: "false"
              run_now: "false"
              job_name_prefix: UC-Sync-Local
              existing_cluster_id: ""
              notebook_path: /Workspace/Users/vivek.ravichandiran@databricks.com/UCSync/notebooks/UC_Sync_Main

    uc_sync_job:
      name: UC-Sync
      tasks:
        - task_key: uc_sync
          notebook_task:
            notebook_path: ../notebooks/UC_Sync_Main
            base_parameters:
              execution_mode: LOCAL
              mode: SYNC
              catalog_mapping_json: '{"ril_sandbox":"ril_sandbox_copy"}'
              catalog_mapping_path: ""
              location_mapping_csv_path: /Volumes/classic_stable_target_vk/uc_sync_ops/uc_exports/config/location-mapping.csv
              catalogs: ""
              schemas: ""
              components: ALL
              include_object_types: ""
              include_parents: "true"
              exclude_object_types: MODEL
              include_regex: ""
              exclude_regex: ".*_TEMP$"
              dry_run: "true"
              export_volume_path: /Volumes/classic_stable_target_vk/uc_sync_ops/uc_exports
              report_volume_path: /Volumes/classic_stable_target_vk/uc_sync_ops/uc_exports
              audit_table: classic_stable_target_vk.uc_sync_ops.uc_sync_audit
