[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uc-sync"
version = "0.2.0"
description = "Databricks notebook-native Unity Catalog cross-workspace sync utility"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "databricks-sdk>=0.36.0",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
